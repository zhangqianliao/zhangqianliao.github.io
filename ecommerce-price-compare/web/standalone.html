<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电商商品价格对比工具</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; padding: 20px; }
.container { max-width: 1200px; margin: 0 auto; }
.header { text-align: center; color: white; margin-bottom: 30px; }
.header h1 { font-size: 2.5em; margin-bottom: 10px; }
.header p { font-size: 1.1em; opacity: 0.9; }
.search-section { background: white; border-radius: 16px; padding: 30px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); margin-bottom: 30px; }
.search-form { display: flex; gap: 15px; flex-wrap: wrap; align-items: center; }
.search-input { flex: 1; min-width: 200px; padding: 14px 20px; border: 2px solid #e0e0e0; border-radius: 10px; font-size: 16px; }
.search-input:focus { outline: none; border-color: #667eea; }
.platform-tag { padding: 8px 16px; border-radius: 20px; border: 2px solid #e0e0e0; background: white; cursor: pointer; font-size: 14px; }
.platform-tag.active { background: #667eea; color: white; border-color: #667eea; }
.search-btn { padding: 14px 32px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
.search-btn:hover { transform: translateY(-2px); }
.search-btn:disabled { opacity: 0.6; cursor: not-allowed; }
.loading { display: none; text-align: center; padding: 40px; }
.loading.active { display: block; }
.spinner { width: 50px; height: 50px; border: 4px solid #f3f3f3; border-top: 4px solid #667eea; border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 20px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
.results-section { display: none; }
.results-section.active { display: block; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 30px; }
.stat-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
.stat-card .label { color: #888; font-size: 14px; margin-bottom: 8px; }
.stat-card .value { font-size: 28px; font-weight: 700; color: #333; }
.stat-card .value.price { color: #e74c3c; }
.charts-row { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; }
@media (max-width: 768px) { .charts-row { grid-template-columns: 1fr; } }
.chart-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.chart-card h3 { margin-bottom: 15px; color: #333; font-size: 18px; }
.chart-container { height: 300px; position: relative; }
.comparison-section { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
.comparison-section h3 { margin-bottom: 20px; color: #333; font-size: 20px; }
.conclusion-box { background: linear-gradient(135deg, #667eea15 0%, #764ba215 100%); border-left: 4px solid #667eea; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; color: #333; line-height: 1.6; }
.platform-compare-table { width: 100%; border-collapse: collapse; }
.platform-compare-table th, .platform-compare-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
.platform-compare-table th { background: #f8f9fa; font-weight: 600; color: #555; }
.best-badge { display: inline-block; padding: 2px 8px; background: #27ae60; color: white; border-radius: 4px; font-size: 12px; margin-left: 5px; }
.recommendations-section { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-bottom: 30px; }
.recommendations-section h3 { margin-bottom: 20px; color: #333; font-size: 20px; }
.recommendation-list { display: flex; flex-direction: column; gap: 15px; }
.recommendation-item { display: flex; gap: 15px; padding: 15px; border-radius: 10px; background: #f8f9fa; }
.rank-badge { width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; color: white; }
.rank-1 { background: linear-gradient(135deg, #f6d365 0%, #fda085 100%); }
.rank-2 { background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%); }
.rank-3 { background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); }
.rank-other { background: linear-gradient(135deg, #a8c0ff 0%, #3f2b96 100%); }
.rec-price { color: #e74c3c; font-weight: 700; font-size: 18px; }
.rec-score { background: #27ae60; color: white; padding: 2px 8px; border-radius: 4px; font-size: 12px; }
.rec-platform { padding: 2px 8px; background: #667eea20; color: #667eea; border-radius: 4px; font-size: 12px; }
.products-section { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.products-section h3 { margin-bottom: 20px; color: #333; font-size: 20px; }
.sort-btn { padding: 6px 14px; border: 1px solid #ddd; background: white; border-radius: 6px; cursor: pointer; font-size: 14px; }
.sort-btn.active { background: #667eea; color: white; }
.products-table { width: 100%; border-collapse: collapse; }
.products-table th, .products-table td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #eee; }
.products-table th { background: #f8f9fa; font-weight: 600; color: #555; }
.products-table .price-col { color: #e74c3c; font-weight: 600; }
.platform-label { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 12px; }
.platform-jingdong { background: #e74c3c20; color: #e74c3c; }
.platform-taobao { background: #f39c1220; color: #f39c12; }
.platform-pinduoduo { background: #e74c3c30; color: #c0392b; }
.sample-banner { background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%); color: white; padding: 12px 20px; border-radius: 8px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
.sample-banner button { background: white; color: #f5576c; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: 600; }
.error-message { background: #fee; color: #c0392b; padding: 15px; border-radius: 8px; margin-bottom: 20px; display: none; }
.error-message.active { display: block; }
</style>
</head>
<body>
<div class="container">
<div class="header">
<h1>电商商品价格对比工具</h1>
<p>纯前端版 - 无需安装 Python，双击打开即可使用</p>
</div>
<div class="search-section">
<div class="sample-banner" id="sampleBanner">
<span>当前展示示例数据（无线蓝牙耳机），输入关键词后点击搜索即可体验</span>
<button onclick="hideSampleBanner()">知道了</button>
</div>
<div class="search-form">
<input type="text" class="search-input" id="keywordInput" placeholder="输入商品关键词" value="无线蓝牙耳机">
<div class="platform-select" id="platformSelect">
<span class="platform-tag active" data-platform="京东">京东</span>
<span class="platform-tag active" data-platform="淘宝">淘宝</span>
<span class="platform-tag active" data-platform="拼多多">拼多多</span>
</div>
<button class="search-btn" id="searchBtn" onclick="doSearch()">开始搜索</button>
</div>
</div>
<div class="error-message" id="errorMsg"></div>
<div class="loading" id="loading">
<div class="spinner"></div>
<p>正在采集商品数据，请稍候...</p>
</div>
<div class="results-section" id="results">
<div class="stats-grid" id="statsGrid"></div>
<div class="charts-row">
<div class="chart-card">
<h3>各平台价格对比</h3>
<div class="chart-container"><canvas id="platformChart"></canvas></div>
</div>
<div class="chart-card">
<h3>价格分布</h3>
<div class="chart-container"><canvas id="distributionChart"></canvas></div>
</div>
</div>
<div class="comparison-section">
<h3>横向对比分析</h3>
<div class="conclusion-box" id="conclusionBox"></div>
<table class="platform-compare-table" id="platformCompareTable">
<thead><tr><th>平台</th><th>商品数量</th><th>最低价</th><th>最高价</th><th>平均价</th><th>总销量</th><th>平均评分</th></tr></thead>
<tbody></tbody>
</table>
</div>
<div class="recommendations-section">
<h3>性价比 TOP 5 推荐</h3>
<div class="recommendation-list" id="recommendationList"></div>
</div>
<div class="products-section">
<h3>全部商品 <span id="productCount" style="font-size:14px;color:#888;font-weight:normal"></span></h3>
<div class="products-toolbar">
<span style="color:#888;font-size:14px;margin-right:10px">排序:</span>
<button class="sort-btn active" data-sort="price" onclick="sortProducts('price')">价格从低到高</button>
<button class="sort-btn" data-sort="sales" onclick="sortProducts('sales')">销量从高到低</button>
<button class="sort-btn" data-sort="rating" onclick="sortProducts('rating')">评分从高到低</button>
<button class="sort-btn" data-sort="value" onclick="sortProducts('value')">性价比</button>
</div>
<div class="products-table-container">
<table class="products-table" id="productsTable">
<thead><tr><th>#</th><th>平台</th><th>商品名称</th><th>价格</th><th>原价</th><th>销量</th><th>评分</th><th>店铺</th></tr></thead>
<tbody></tbody>
</table>
</div>
</div>
</div>
</div>
<script>
let currentData = null;
let platformChart = null;
let distributionChart = null;
let currentSort = 'price';

const platformColors = { '京东': '#e74c3c', '淘宝': '#f39c12', '拼多多': '#c0392b' };
const platformClass = { '京东': 'platform-jingdong', '淘宝': 'platform-taobao', '拼多多': 'platform-pinduoduo' };

function hideSampleBanner() {
    document.getElementById('sampleBanner').style.display = 'none';
}

document.querySelectorAll('.platform-tag').forEach(tag => {
    tag.addEventListener('click', function() {
        this.classList.toggle('active');
    });
});

document.getElementById('keywordInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doSearch();
});

function getSelectedPlatforms() {
    const selected = [];
    document.querySelectorAll('.platform-tag.active').forEach(tag => {
        selected.push(tag.dataset.platform);
    });
    return selected;
}

function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = msg;
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 5000);
}

function formatSales(sales) {
    if (sales >= 10000) return (sales / 10000).toFixed(1) + '万';
    return sales.toString();
}

function hashString(str) {
    let hash = 0;
    for (let i = 0; i < str.length; i++) {
        hash = (hash << 5) - hash + str.charCodeAt(i);
        hash |= 0;
    }
    return Math.abs(hash);
}

function generateMockData(keyword, platforms, pageSize) {
    const adjectives = ['新款', '热销', '爆款', '正品', '旗舰', '官方', '精选', '优质', '特价', '限量'];
    const suffixes = ['套装', '礼盒', '标准版', '升级版', '豪华版', 'Pro版', 'Max版'];
    const shopPrefix = {
        '京东': ['京东自营', '京东官方', '京东旗舰', '品质'],
        '淘宝': ['天猫', '淘宝', '品牌', '官方'],
        '拼多多': ['拼多多', '百亿补贴', '工厂', '百亿']
    };
    const basePrice = {
        '手机': [800, 6000], '蓝牙耳机': [50, 600], '笔记本电脑': [3000, 12000],
        '键盘': [50, 800], '鼠标': [30, 500], '显示器': [500, 3000],
        '充电宝': [30, 200], '数据线': [10, 80], '手表': [200, 3000],
        '运动鞋': [100, 800], '水杯': [20, 200]
    };
    
    const products = [];
    const seed = hashString(keyword);
    const rng = {
        state: seed,
        next: function() {
            this.state = (this.state * 1103515245 + 12345) & 0x7fffffff;
            return this.state / 0x7fffffff;
        },
        int: function(min, max) {
            return Math.floor(this.next() * (max - min + 1)) + min;
        },
        choice: function(arr) {
            return arr[this.int(0, arr.length - 1)];
        }
    };

    for (let i = 0; i < platforms.length; i++) {
        const platform = platforms[i];
        const count = rng.int(Math.max(3, Math.floor(pageSize / 2)), pageSize);
        const priceRange = basePrice[keyword] || [50, 2000];
        
        for (let j = 0; j < count; j++) {
            const adj = rng.choice(adjectives);
            const suffix = rng.next() > 0.5 ? rng.choice(suffixes) : '';
            const name = adj + keyword + suffix;
            const price = Math.round((priceRange[0] + (priceRange[1] - priceRange[0]) * rng.next()) * 100) / 100;
            const originalPrice = Math.round(price * (1.1 + rng.next() * 0.6) * 100) / 100;
            const sales = rng.int(100, 300000);
            const rating = Math.round((4.0 + rng.next() * 1.0) * 10) / 10;
            const shop = rng.choice(shopPrefix[platform]) + keyword.substring(0, 3) + '专营店';
            
            products.push({
                name: name,
                price: price,
                original_price: originalPrice,
                platform: platform,
                url: '#',
                sales: sales,
                shop_rating: rating,
                shop_name: shop,
                product_id: platform[0] + rng.int(100000, 999999)
            });
        }
    }
    return products;
}

function cleanData(products) {
    const seen = new Set();
    return products.filter(p => {
        if (!p.name || p.price <= 0) return false;
        const key = p.product_id || p.name;
        if (seen.has(key)) return false;
        seen.add(key);
        p.price = Math.round(p.price * 100) / 100;
        p.sales = Math.max(0, Math.floor(p.sales));
        p.shop_rating = Math.min(5, Math.max(0, Math.round(p.shop_rating * 10) / 10));
        return true;
    });
}

function calculateValueScores(products) {
    if (!products.length) return {};
    const prices = products.map(p => p.price);
    const sales = products.map(p => p.sales);
    const ratings = products.map(p => p.shop_rating);
    const minP = Math.min(...prices), maxP = Math.max(...prices);
    const maxS = Math.max(...sales);
    const maxR = Math.max(...ratings);
    
    const scores = {};
    for (let i = 0; i < products.length; i++) {
        const p = products[i];
        const ps = minP === maxP ? 0.5 : 1 - (p.price - minP) / (maxP - minP);
        const ss = maxS > 0 ? p.sales / maxS : 0;
        const rs = maxR > 0 ? p.shop_rating / maxR : 0;
        scores[p.product_id || p.name] = Math.round((ps * 0.4 + ss * 0.35 + rs * 0.25) * 1000) / 10;
    }
    return scores;
}

function fullAnalysis(products) {
    products = cleanData(products);
    products.sort(function(a, b) { return a.price - b.price; });
    
    const prices = products.map(p => p.price);
    const n = prices.length;
    const sorted = [...prices].sort(function(a, b) { return a - b; });
    
    const priceStats = {
        count: n,
        min: n ? Math.min(...prices) : 0,
        max: n ? Math.max(...prices) : 0,
        avg: n ? Math.round(prices.reduce(function(a, b) { return a + b; }, 0) / n * 100) / 100 : 0,
        median: n ? Math.round(sorted[Math.floor(n / 2)] * 100) / 100 : 0,
        range: n ? Math.round((Math.max(...prices) - Math.min(...prices)) * 100) / 100 : 0
    };
    
    const platformData = {};
    for (let i = 0; i < products.length; i++) {
        const p = products[i];
        if (!platformData[p.platform]) {
            platformData[p.platform] = { products: [], min_price: Infinity, max_price: -Infinity, total: 0, totalSales: 0, totalRating: 0 };
        }
        platformData[p.platform].products.push(p);
        platformData[p.platform].min_price = Math.min(platformData[p.platform].min_price, p.price);
        platformData[p.platform].max_price = Math.max(platformData[p.platform].max_price, p.price);
        platformData[p.platform].total += p.price;
        platformData[p.platform].totalSales += p.sales;
        platformData[p.platform].totalRating += p.shop_rating;
    }
    
    const platformStats = {};
    for (const [k, v] of Object.entries(platformData)) {
        platformStats[k] = {
            count: v.products.length,
            min_price: v.min_price,
            max_price: v.max_price,
            avg_price: Math.round(v.total / v.products.length * 100) / 100,
            total_sales: v.totalSales,
            avg_rating: Math.round(v.totalRating / v.products.length * 100) / 100
        };
    }
    
    let cheapest = null, highest = null, most = null;
    let minAvg = Infinity, maxAvgRating = 0, maxCount = 0;
    for (const [p, s] of Object.entries(platformStats)) {
        if (s.avg_price < minAvg) { minAvg = s.avg_price; cheapest = p; }
        if (s.avg_rating > maxAvgRating) { maxAvgRating = s.avg_rating; highest = p; }
        if (s.count > maxCount) { maxCount = s.count; most = p; }
    }
    
    const conclusion = cheapest + '平均价格最低；' + highest + '店铺评分最高；' + most + '商品数量最多；价格区间 ' + priceStats.min.toFixed(2) + ' - ' + priceStats.max.toFixed(2) + ' 元。';
    
    const scores = calculateValueScores(products);
    const recs = products.map(function(p) {
        return { product: p, score: scores[p.product_id || p.name] || 0 };
    }).sort(function(a, b) { return b.score - a.score; }).slice(0, 5).map(function(r, i) {
        return { rank: i + 1, score: r.score, product: r.product };
    });
    
    const bins = 10;
    const minP = priceStats.min, maxP = priceStats.max;
    const binSize = (maxP - minP) / bins || 1;
    const labels = [], counts = [];
    for (let i = 0; i < bins; i++) {
        const s = minP + i * binSize;
        const e = minP + (i + 1) * binSize;
        labels.push(s.toFixed(0) + '-' + e.toFixed(0));
        counts.push(products.filter(function(p) {
            return p.price >= s && (i === bins - 1 || p.price < e);
        }).length);
    }
    
    return {
        products: products,
        priceStats: priceStats,
        platformStats: platformStats,
        comparison: { platformStats: platformStats, cheapest_platform: cheapest, highest_rating_platform: highest, most_products_platform: most, conclusion: conclusion },
        price_distribution: { bins: labels, counts: counts },
        value_recommendations: recs
    };
}

function doSearch() {
    const keyword = document.getElementById('keywordInput').value.trim();
    if (!keyword) { showError('请输入搜索关键词'); return; }
    
    const platforms = getSelectedPlatforms();
    if (platforms.length === 0) { showError('请至少选择一个平台'); return; }
    
    document.getElementById('errorMsg').classList.remove('active');
    document.getElementById('loading').classList.add('active');
    document.getElementById('results').classList.remove('active');
    document.getElementById('searchBtn').disabled = true;
    
    setTimeout(function() {
        try {
            const products = generateMockData(keyword, platforms, 20);
            currentData = fullAnalysis(products);
            renderResults(currentData, keyword);
            document.getElementById('loading').classList.remove('active');
            document.getElementById('results').classList.add('active');
            hideSampleBanner();
        } catch (e) {
            showError('搜索失败: ' + e.message);
            document.getElementById('loading').classList.remove('active');
        }
        document.getElementById('searchBtn').disabled = false;
    }, 800);
}

function renderResults(analysis, keyword) {
    renderStats(analysis.priceStats);
    renderPlatformChart(analysis.platformStats);
    renderDistributionChart(analysis.price_distribution);
    renderComparison(analysis.comparison);
    renderRecommendations(analysis.value_recommendations);
    renderProductsTable(analysis.products);
}

function renderStats(priceStats) {
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = `
        <div class="stat-card"><div class="label">商品总数</div><div class="value">${priceStats.count}</div></div>
        <div class="stat-card"><div class="label">最低价</div><div class="value price">¥${priceStats.min.toFixed(2)}</div></div>
        <div class="stat-card"><div class="label">最高价</div><div class="value price">¥${priceStats.max.toFixed(2)}</div></div>
        <div class="stat-card"><div class="label">平均价</div><div class="value price">¥${priceStats.avg.toFixed(2)}</div></div>
        <div class="stat-card"><div class="label">价格中位数</div><div class="value price">¥${priceStats.median.toFixed(2)}</div></div>
        <div class="stat-card"><div class="label">价格区间</div><div class="value price">¥${priceStats.range.toFixed(2)}</div></div>
    `;
}

function renderPlatformChart(platformStats) {
    const ctx = document.getElementById('platformChart').getContext('2d');
    if (platformChart) platformChart.destroy();
    
    const labels = Object.keys(platformStats);
    const avgPrices = labels.map(function(p) { return platformStats[p].avg_price; });
    const minPrices = labels.map(function(p) { return platformStats[p].min_price; });
    const maxPrices = labels.map(function(p) { return platformStats[p].max_price; });
    const colors = labels.map(function(p) { return platformColors[p] || '#667eea'; });
    
    platformChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [
                { label: '最低价', data: minPrices, backgroundColor: colors.map(function(c) { return c + '40'; }), borderColor: colors, borderWidth: 2, borderRadius: 6 },
                { label: '平均价', data: avgPrices, backgroundColor: colors.map(function(c) { return c + '80'; }), borderColor: colors, borderWidth: 2, borderRadius: 6 },
                { label: '最高价', data: maxPrices, backgroundColor: colors, borderColor: colors, borderWidth: 2, borderRadius: 6 }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { position: 'top' } },
            scales: { y: { beginAtZero: true, ticks: { callback: function(v) { return '¥' + v; } } } }
        }
    });
}

function renderDistributionChart(distribution) {
    const ctx = document.getElementById('distributionChart').getContext('2d');
    if (distributionChart) distributionChart.destroy();
    
    distributionChart = new Chart(ctx, {
        type: 'line',
        data: {
            labels: distribution.bins,

}

function renderComparison(comparison) {
    document.getElementById('conclusionBox').innerHTML = comparison.conclusion;
    
    const tbody = document.querySelector('#platformCompareTable tbody');
    const stats = comparison.platformStats;
    const cheapest = comparison.cheapest_platform;
    const highestRating = comparison.highest_rating_platform;
    const mostProducts = comparison.most_products_platform;
    
    let html = '';
    for (const [platform, data] of Object.entries(stats)) {
        html += `<tr>
            <td><span class="platform-label ${platformClass[platform]}">${platform}</span></td>
            <td>${data.count}${platform === mostProducts ? '<span class="best-badge">最多</span>' : ''}</td>
            <td>¥${data.min_price.toFixed(2)}${platform === cheapest ? '<span class="best-badge">最低</span>' : ''}</td>
            <td>¥${data.max_price.toFixed(2)}</td>
            <td>¥${data.avg_price.toFixed(2)}</td>
            <td>${formatSales(data.total_sales)}</td>
            <td>${data.avg_rating.toFixed(2)}${platform === highestRating ? '<span class="best-badge">最高</span>' : ''}</td>
        </tr>`;
    }
    tbody.innerHTML = html;
}

function renderRecommendations(recommendations) {
    const list = document.getElementById('recommendationList');
    let html = '';
    for (let i = 0; i < recommendations.length; i++) {
        const item = recommendations[i];
        const p = item.product;
        const rc = i < 3 ? 'rank-' + (i + 1) : 'rank-other';
        html += `<div class="recommendation-item">
            <div class="rank-badge ${rc}">${i + 1}</div>
            <div class="rec-info">
                <div class="rec-name">${p.name}</div>
                <div class="rec-meta">
                    <span class="rec-price">¥${p.price.toFixed(2)}</span>
                    <span class="rec-score">性价比 ${item.score.toFixed(1)}分</span>
                    <span class="rec-platform">${p.platform}</span>
                    <span>销量:${formatSales(p.sales)}</span>
                    <span>评分:${p.shop_rating.toFixed(1)}</span>
                </div>
            </div>
        </div>`;
    }
    list.innerHTML = html;
}

function renderProductsTable(products) {
    const tbody = document.querySelector('#productsTable tbody');
    document.getElementById('productCount').textContent = '(共 ' + products.length + ' 件)';
    
    let html = '';
    for (let i = 0; i < products.length; i++) {
        const p = products[i];
        html += `<tr>
            <td>${i + 1}</td>
            <td><span class="platform-label ${platformClass[p.platform]}">${p.platform}</span></td>
            <td>${p.name}</td>
            <td class="price-col">¥${p.price.toFixed(2)}</td>
            <td style="color:#999;text-decoration:line-through">¥${p.original_price.toFixed(2)}</td>
            <td>${formatSales(p.sales)}</td>
            <td>${p.shop_rating.toFixed(1)}</td>
            <td>${p.shop_name}</td>
        </tr>`;
    }
    tbody.innerHTML = html;
}

function sortProducts(sortType) {
    if (!currentData) return;
    currentSort = sortType;
    
    document.querySelectorAll('.sort-btn').forEach(function(btn) {
        btn.classList.toggle('active', btn.dataset.sort === sortType);
    });
    
    const products = [...currentData.products];
    if (sortType === 'price') {
        products.sort(function(a, b) { return a.price - b.price; });
    } else if (sortType === 'sales') {
        products.sort(function(a, b) { return b.sales - a.sales; });
    } else if (sortType === 'rating') {
        products.sort(function(a, b) { return b.shop_rating - a.shop_rating; });
    } else if (sortType === 'value') {
        const sc = {};
        currentData.value_recommendations.forEach(function(item) {
            sc[item.product.product_id || item.product.name] = item.score;
        });
        products.sort(function(a, b) {
            const sa = sc[a.product_id || a.name] || 0;
            const sb = sc[b.product_id || b.name] || 0;
            return sb - sa;
        });
    }
    renderProductsTable(products);
}
